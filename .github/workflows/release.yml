name: Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  # ── Create GitHub Release ──────────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version metadata
        id: meta
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG"     >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate changelog from git log
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)

          # Conventional-commit grouped changelog
          CHANGELOG=$(git log "${PREV_TAG}..HEAD" --pretty=format:"%s (%h)" | awk '
            /^feat(\(.+\))?:/   { feat=feat "\n- " $0 }
            /^fix(\(.+\))?:/    { fix=fix "\n- " $0 }
            /^perf(\(.+\))?:/   { perf=perf "\n- " $0 }
            /^refactor(\(.+\))?:/ { refactor=refactor "\n- " $0 }
            /^chore(\(.+\))?:/  { chore=chore "\n- " $0 }
            /^docs(\(.+\))?:/   { docs=docs "\n- " $0 }
            /^BREAKING CHANGE:/ { breaking=breaking "\n- " $0 }
            END {
              if (breaking) print "### Breaking Changes\n" breaking "\n"
              if (feat)     print "### Features\n" feat "\n"
              if (fix)      print "### Bug Fixes\n" fix "\n"
              if (perf)     print "### Performance\n" perf "\n"
              if (refactor) print "### Refactoring\n" refactor "\n"
              if (docs)     print "### Documentation\n" docs "\n"
              if (chore)    print "### Chores\n" chore "\n"
            }
          ')

          # Write to file (preserves newlines)
          echo "$CHANGELOG" > changelog.md
          echo "Changelog generated"
          cat changelog.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: xcare ${{ steps.meta.outputs.version }}
          body_path: changelog.md
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.meta.outputs.tag, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Docker Build & Publish ─────────────────────────────────────────────────
  docker-publish:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: create-release

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (multi-platform)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: docker-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
